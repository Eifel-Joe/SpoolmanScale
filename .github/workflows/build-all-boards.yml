name: Build and Release

# A tag push builds every board, creates the GitHub release and then publishes
# to this fork's GitHub Pages. What goes where:
#
#   GitHub release   for every board the image the device downloads
#                    (SpoolmanScale.bin for the WT32, SpoolmanScale-<board>.bin
#                    for the others), the same with the version in its name
#                    for the browser upload, and the factory image to flash at
#                    offset 0 over USB
#   branch gh-pages  version.json, on every tag; on a stable tag (vX.Y.Z, no
#                    -beta.N) also the web flasher: index.html from flasher/,
#                    one manifest-<board>.json per board and each board's
#                    factory image under the fixed name its manifest points at
#
# The pages of this fork are served from the branch gh-pages, so that is where
# version.json and the flasher go. main stays a mirror of the original and is
# not written by this workflow. The release comes first and the pages follow:
# the device reads the tag from version.json and downloads from that tag's
# release, so version.json must never name a release that does not exist, not
# yet or not at all because its upload failed.
#
# Only a tag push releases and publishes. A manual run (workflow_dispatch)
# builds every board, checks the images the same way and stops there: its
# github.ref_name is a branch, so the release would get the branch's name as
# its tag while version.json named FW_VERSION, a release that does not exist.
# The steps that only serve the release and the pages carry
# `if: github.ref_type == 'tag'`.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
# One run at a time. Two tags pushed close together would otherwise both
# read the same version.json from gh-pages, and the second push would be
# refused or the older tag would land last. A run that has started is not
# cancelled: it may have created its release already, and its pages must
# follow. GitHub keeps one waiting run per group: a third tag pushed while
# one runs and one waits cancels the waiting one, so tag one at a time.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    # This job builds and releases every board, but GitHub shows the job of a
    # matrix as "<name> (<matrix values>)", here "build (wt32-sc01-plus)", as
    # if only the WT32 were released. The suffix is left out when the name
    # itself holds a matrix expression. This one evaluates to the empty string
    # (`&&` returns its last operand), so the name stays as written. A plain
    # name would still get the suffix; test/test_release_workflow.py pins the
    # line.
    name: Build and release all boards${{ matrix.env && '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Every board but the matrix one, by its BOARD_ID. Built in "Build the
      # other boards", its factory image published in "Publish to gh-pages".
      # A new board is one more name here and in scripts/release_files.py
      # (OTHER_BOARDS, MODELS); test/test_release_workflow.py holds both to
      # the boards in src/boards.
      OTHER_BOARDS: waveshare-s3-lcd7 waveshare-s3-lcd7b
    strategy:
      matrix:
        env: [wt32-sc01-plus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots (partitions.csv). Since
        # v0.8.3 the firmware may outgrow the 3 MB slots of scales flashed
        # before that: such a scale reads the size from version.json, offers
        # the web flasher instead of the update, and moves to the new table
        # over USB once. More than 6 MB fits no device at all.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Read version from app_config.h
        id: version
        run: |
          # FW_VERSION moved out of main.cpp into app_config.h during the
          # refactor. The old grep silently returned an empty string, which
          # would have produced a release named "SpoolmanScale " with an empty
          # version in version.json instead of failing.
          VERSION=$(grep '#define FW_VERSION' src/app_config.h | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::FW_VERSION not found in src/app_config.h"
            exit 1
          fi
          # Only on a tag push. A manual workflow_dispatch run has a branch
          # name in GITHUB_REF_NAME and must not be held to this.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FW_VERSION $VERSION"
            exit 1
          fi
          echo "Building $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Refuse a tag that is not newer than what is published
        if: github.ref_type == 'tag'
        run: |
          # The check above only compares the tag against FW_VERSION, so two
          # matching but too low numbers pass it. Since the firmware compares
          # itself against version.json, a tag ranking below the published one
          # would put a red dot on every device and offer them a downgrade.
          #
          # What counts is the version.json on gh-pages, the file the devices
          # read, not the one in the tagged commit (that is the original's and
          # stays behind). Before the first release gh-pages has none, which
          # means nothing is published yet. "Update version.json" continues
          # from the same file, and "Publish to gh-pages" commits on top of the
          # same commit of gh-pages: should gh-pages move in between, the push
          # there is refused instead of overwriting what moved it.
          #
          # The ranking is the one of src/services/version_compare.cpp, over
          # the top level and every board node (scripts/release_files.py, held
          # to it by test/test_release_files.py).
          VERSION=${{ steps.version.outputs.version }}
          git fetch origin gh-pages
          # Stops here when the fetch left no origin/gh-pages, rather than
          # taking that for "nothing published yet" on the next line.
          git rev-parse --verify origin/gh-pages
          git show origin/gh-pages:version.json > published.json || echo '{}' > published.json
          python3 scripts/release_files.py check published.json "$VERSION"
      - name: Prepare release assets
        run: |
          # Always, for both kinds of tag. The device downloads
          # releases/download/<tag>/SpoolmanScale.bin, so every release needs an
          # asset under that exact name, and it has to be the binary just built.
          VERSION=${{ steps.version.outputs.version }}
          cp .pio/build/${{ matrix.env }}/firmware.bin SpoolmanScale.bin
          cp .pio/build/${{ matrix.env }}/firmware.bin SpoolmanScale_${VERSION}.bin
          # The factory image as for every other board below: the file the
          # platform merged at the end of the build, looked over by the same
          # script as in ci.yml before it is kept. The release takes it along
          # with SpoolmanScale-*.bin.
          python3 scripts/factory_image.py .pio/build/${{ matrix.env }} SpoolmanScale-${{ matrix.env }}_${VERSION}_factory.bin
      - name: Build the other boards
        # The matrix above is the board whose image the fleet knows by its
        # plain name, SpoolmanScale.bin, and whose entry is the top level of
        # version.json. Every other board (OTHER_BOARDS, at the top of this
        # job) is built here, in the same job, because the steps below
        # publish once for all of them. Each gets three assets under its own
        # name:
        #   SpoolmanScale-<board>.bin                    what the device downloads
        #   SpoolmanScale-<board>_<version>.bin          for the browser upload
        #   SpoolmanScale-<board>_<version>_factory.bin  bootloader, partition
        #     table and firmware in one file, to flash at offset 0 over USB
        # The factory image is the one the platform writes at the end of every
        # build (firmware.factory.bin), looked over by scripts/factory_image.py
        # as in ci.yml. No esptool merge of our own: started through
        # `pio pkg exec` it lacks the rich_click module esptool 5.4 imports
        # and stopped every release here (the factory step in ci.yml has the
        # details).
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for BOARD in $OTHER_BOARDS; do
            pio run -e "$BOARD"
            OUT=".pio/build/$BOARD"
            SIZE=$(stat -c %s "$OUT/firmware.bin")
            echo "$BOARD firmware.bin: $SIZE bytes of 6291456"
            if [ "$SIZE" -gt 6291456 ]; then
              echo "::error::$BOARD firmware.bin is $SIZE bytes, more than the 6 MB app slot"
              exit 1
            fi
            cp "$OUT/firmware.bin" "SpoolmanScale-$BOARD.bin"
            cp "$OUT/firmware.bin" "SpoolmanScale-${BOARD}_${VERSION}.bin"
            python3 scripts/factory_image.py "$OUT" "SpoolmanScale-${BOARD}_${VERSION}_factory.bin"
          done
      - name: Check that every image names its board
        # Every image carries "SpoolmanScale-board:<board id>" (src/services/
        # board_image.cpp), and the scale refuses an image of another board
        # when it flashes, from the download and from the browser upload.
        # What the scale cannot know is which file this workflow put under
        # which name: version.json takes the sha256 of that very file, so a
        # build for the wrong board stored under another board's name carries
        # a sum that matches. So every file the release carries is read here
        # for the line of the board it is named for
        # (scripts/board_marker.py, test/test_board_marker.py): the device
        # file, the file for the browser upload and the factory image of each
        # board. A failure stops the run before version.json takes the
        # checksums, before the release and before the pages. On a manual run
        # as well, like the checks above: no `if:`. The first failing call ends
        # the step, whichever shell runs it: the default `bash -e` would do,
        # but nothing in this file would say so, hence `set -euo pipefail`.
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          # The matrix board, whose device file has no board in its name.
          python3 scripts/board_marker.py SpoolmanScale.bin ${{ matrix.env }}
          python3 scripts/board_marker.py "SpoolmanScale_${VERSION}.bin" ${{ matrix.env }}
          python3 scripts/board_marker.py "SpoolmanScale-${{ matrix.env }}_${VERSION}_factory.bin" ${{ matrix.env }}
          for BOARD in $OTHER_BOARDS; do
            python3 scripts/board_marker.py "SpoolmanScale-$BOARD.bin" "$BOARD"
            python3 scripts/board_marker.py "SpoolmanScale-${BOARD}_${VERSION}.bin" "$BOARD"
            python3 scripts/board_marker.py "SpoolmanScale-${BOARD}_${VERSION}_factory.bin" "$BOARD"
          done
      - name: Update version.json
        if: github.ref_type == 'tag'
        run: |
          # Read by the firmware's background update check. Deliberately a
          # static file on Pages rather than api.github.com: that API allows
          # 60 requests per hour and IP, which users behind carrier grade NAT
          # share, and its release list runs to over a hundred kilobytes.
          #
          # scripts/release_files.py continues from the published file read
          # above and enters this version with the checksum and size of every
          # board's image: the WT32's (SpoolmanScale.bin) on the top level,
          # every other board's (SpoolmanScale-<board>.bin) in a node of its
          # own under "boards", where its firmware looks (BOARD_VERSION_NODE).
          # A tag with a beta counter (v0.8.4-beta.1) only lands in
          # "prerelease"; a stable tag (v0.8.4) updates "stable" too, so that
          # devices with pre-releases switched off see it. The device sums the
          # download as it writes it and refuses to commit on a mismatch; the
          # size lets a device on the old 3 MB partition table offer the web
          # flasher instead of an update that would not fit.
          python3 scripts/release_files.py version-json published.json version.json "${{ steps.version.outputs.version }}" .
      - name: Release title
        id: title
        if: github.ref_type == 'tag'
        env:
          # The day in German time: the runner's clock is UTC and would date
          # a tag pushed shortly after midnight to the day before. date.today()
          # in release_files.py follows TZ.
          TZ: Europe/Berlin
        run: |
          # "SpoolmanScale v0.8.4" for a stable tag. A pre-release carries the
          # day of the build, "SpoolmanScale v0.8.4-beta.1 (25.10.2026)": its
          # tag alone does not say when it was made.
          TITLE=$(python3 scripts/release_files.py title "${{ steps.version.outputs.version }}")
          echo "$TITLE"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        # Before the pages, see the top of this file.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.title.outputs.title }}
          # Only builds carrying a beta counter are pre-releases, the same
          # line version.json draws (a -beta.N tag fills only its "prerelease"
          # keys). The flag does not change what a device installs: it
          # downloads a release by its tag, releases/download/<tag>/<asset>
          # (src/services/github_release.cpp). Together with version.json it
          # decides who is offered it. With the "Pre-release" switch off, the
          # daily check reads the "stable" keys of version.json and a check by
          # hand asks releases/latest, which skips pre-releases; a stable tag
          # marked pre-release would stay hidden from that check.
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # A file named below and not built fails the step, before the pages
          # name a release that lacks the image a device would download.
          fail_on_unmatched_files: true
          # SpoolmanScale-*.bin takes both files of every other board and the
          # factory image of every board, the WT32's included.
          files: |
            SpoolmanScale.bin
            SpoolmanScale_${{ steps.version.outputs.version }}.bin
            SpoolmanScale-*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to gh-pages
        # After the release, see the top of this file. In a worktree of its
        # own under the runner's temp folder, on the commit of gh-pages the
        # check above read: the tag checkout stays as it is, and the release
        # files in it do not get mixed up with the pages.
        #
        # Every tag: version.json. A pre-release (-beta.N) stops there and
        # leaves the flasher as it is, so that nobody outside a test is
        # offered a test build to flash.
        #
        # A stable tag also renews the web flasher: index.html is
        # flasher/index.html with its line "Firmware vX.Y.Z" set to this
        # version (taken from the repository every time, not from the last
        # published page, so the line to replace is always the one there),
        # manifest-<board>.json per board comes from scripts/release_files.py,
        # and each board's factory image goes under the name its manifest
        # points at, SpoolmanScale-<board>_factory.bin (without the version,
        # so that the manifests only change in their version line). The
        # single-board manifest.json of the first, hand-made flasher goes.
        # .nojekyll stays: it keeps Pages from running the files through
        # Jekyll.
        if: github.ref_type == 'tag'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PAGES="$RUNNER_TEMP/gh-pages"
          git worktree add --detach "$PAGES" origin/gh-pages
          cd "$PAGES"
          cp "$GITHUB_WORKSPACE/version.json" version.json
          git add version.json
          if [[ "$VERSION" =~ -beta\.[0-9]+$ ]]; then
            echo "$VERSION is a pre-release: version.json only, the flasher stays"
          else
            sed -E "s/Firmware v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?/Firmware $VERSION/" "$GITHUB_WORKSPACE/flasher/index.html" > index.html
            if ! grep -qF "Firmware $VERSION" index.html; then
              echo "::error::flasher/index.html has no line Firmware vX.Y.Z to set to $VERSION"
              exit 1
            fi
            python3 "$GITHUB_WORKSPACE/scripts/release_files.py" manifests . "$VERSION"
            for BOARD in ${{ matrix.env }} $OTHER_BOARDS; do
              cp "$GITHUB_WORKSPACE/SpoolmanScale-${BOARD}_${VERSION}_factory.bin" "SpoolmanScale-${BOARD}_factory.bin"
            done
            git rm -f --ignore-unmatch manifest.json
            git add index.html manifest-*.json SpoolmanScale-*_factory.bin
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Pages: publish $VERSION"
          git push origin HEAD:gh-pages
