name: CI

# Every push to a working branch and every pull request: the house rules of
# this project as a script, and a firmware build. The release itself stays
# in build-all-boards.yml and runs on a tag push only.
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**', 'feat/**']
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']
  pull_request:
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (node --check for the page scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scripts/check.sh
        run: scripts/check.sh
      - name: Test Bluetooth discovery
        run: python3 test/test_ble_discovery.py
      - name: Test FilaMan label orientation
        run: python3 test/test_label_fit.py
      - name: Test label raster crop
        run: python3 test/test_label_raster_crop.py
      - name: Test label empty fields
        run: python3 test/test_label_gaps.py
      - name: Test Brother QL rules
        run: python3 test/test_brother_ql.py
      - name: Test local date parser
        run: python3 test/test_local_date.py
      - name: Test accent fold
        run: python3 test/test_accent_fold.py
      - name: Test card uids merge
        run: python3 test/test_card_uids_merge.py
      - name: Test settings backup rules
        run: python3 test/test_backup_rules.py
      - name: Test panel scale
        run: python3 test/test_panel_scale.py
      - name: Test CH32V003 expander
        run: python3 test/test_io_ch32v003.py
      - name: Test spool parts rules
        run: python3 test/test_spool_extras_rules.py
      - name: Test backend job rules
        run: python3 test/test_backend_job_rules.py
      - name: Test worker heap floors
        run: python3 test/test_worker_heap_floors.py
      - name: Test update source
        run: python3 test/test_update_source.py
      - name: Test update screen
        run: python3 test/test_update_screen.py
      - name: Test factory image
        run: python3 test/test_factory_image.py
      - name: Test board marker
        run: python3 test/test_board_marker.py
      - name: Test board image paths
        run: python3 test/test_board_image_paths.py
      - name: Test board image
        run: python3 test/test_board_image.py
      - name: Test release files
        run: python3 test/test_release_files.py
      - name: Test release workflow
        run: python3 test/test_release_workflow.py
      - name: Test flasher page
        run: python3 test/test_flasher_page.py
      - name: Test version compare
        run: python3 test/test_version_compare.py
      - name: Test spool type rules
        run: python3 test/test_spool_type_rules.py
      - name: Test spool type gate
        run: python3 test/test_spool_type_gate.py
      - name: Test density rules
        run: python3 test/test_density_rules.py
      - name: Test density card
        run: python3 test/test_density_card.py
      - name: Test no tag create rules
        run: python3 test/test_no_tag_create.py
      - name: Test copy rules
        run: python3 test/test_copy_rules.py
      - name: Test spool start rules
        run: python3 test/test_spool_start.py
      - name: Test sort entry rules
        run: python3 test/test_sort_entry_rules.py
      - name: Test bambuddy name rules
        run: python3 test/test_bambuddy_name.py

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      # One job per board: a change that builds for one and breaks another
      # is caught here, not by whoever owns the other board.
      fail-fast: false
      matrix:
        env: [wt32-sc01-plus, waveshare-s3-lcd7, waveshare-s3-lcd7b]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      # The platform (pioarduino 55.03.312-1) installs "pioarduino>=6.2.0"
      # into a fresh ~/.platformio/penv on every run (builder/penv_setup.py),
      # through uv or pip, and both read these constraint variables. Since
      # 26.10.2026 PyPI's newest is 6.2.0.post1, which calls itself
      # 6.2.0-post.1, and the platform (platform.json: platformio >=6.2.0)
      # refuses it: every build failed with IncompatiblePlatform. Drop the pin
      # once a pioarduino >= 6.2.0 is out that the platform accepts.
      - name: Pin pioarduino to 6.2.0
        run: |
          echo "pioarduino==6.2.0" > "$RUNNER_TEMP/pio-constraints.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Show the pioarduino the build ran with
        if: always()
        run: ls -d ~/.platformio/penv/lib/python3*/site-packages/pioarduino-*.dist-info || true
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots (partitions.csv). Since
        # v0.8.3 the firmware may outgrow the 3 MB slots of scales flashed
        # before that: such a scale reads the size from version.json, offers
        # the web flasher instead of the update, and moves to the new table
        # over USB once. More than 6 MB fits no device at all.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Check the board line
        # Every image carries "SpoolmanScale-board:<board id>", which the scale
        # reads before it takes an image (src/services/board_image.cpp). Read
        # here for every board on every push, with the same script the release
        # workflow runs over its files (scripts/board_marker.py): a build that
        # lost its line or carries another board's shows now, not on the day
        # of a release.
        run: python3 scripts/board_marker.py .pio/build/${{ matrix.env }}/firmware.bin ${{ matrix.env }}
      # Here rather than in the house-rules job: both tools measure icons from
      # LVGL's symbol header, and that only exists once the build has unpacked
      # the library.
      - name: French column and width budgets
        # Once is enough: the texts are the same on every board, and the tools
        # read LVGL's symbol header from this board's libdeps.
        if: matrix.env == 'wt32-sc01-plus'
        run: |
          if [ -f tools/lang_fr.py ]; then
            python3 tools/lang_fr.py check
            python3 tools/fit_check.py --gate
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
      - name: Check the factory image
        # Why every board leaves one: a board whose screen cannot open yet (a
        # new one, or a panel setup that is still wrong) cannot reach the
        # settings page or the browser upload, the two gates every other way
        # of getting firmware onto a scale goes through. Its first flash is
        # over USB, at offset 0, and that takes bootloader, partition table,
        # boot_app0 and firmware as one file.
        #
        # The platform already writes that file at the end of every build:
        # firmware.factory.bin, merged by esptool at 0x0 bootloader, 0x8000
        # partitions, 0xe000 boot_app0, 0x10000 firmware, with the flash mode,
        # frequency and size of the board (esp32_create_combined_bin in the
        # platform's builder; its lines show in the build log). So this does
        # not merge a second time. It would not be safer: `pio pkg exec`
        # starts esptool with the Python that runs pio, and that one lacks the
        # rich_click module esptool 5.4 imports (it fails with
        # ModuleNotFoundError when tried on a Windows machine), while the
        # platform's own step uses its private environment.
        #
        # What the platform does not do is fail the build when that merge goes
        # wrong, it only prints a line. A broken image must not reach someone
        # who has no screen to find out with, so look at the result here.
        #
        # The look is scripts/factory_image.py (test/test_factory_image.py
        # holds it to what it must refuse), so that the release workflow checks
        # its factory file with the same code. It prints the sizes, refuses a
        # file that does not hold this build's firmware at 0x10000 or lacks the
        # bootloader and the partition table, and only then copies.
        #
        # The copy gets a name of its own, so that images of different boards
        # cannot be mixed up once downloaded (same scheme as the release's
        # factory file). To flash: esptool --chip esp32s3 write-flash 0x0 <file>
        run: python3 scripts/factory_image.py .pio/build/${{ matrix.env }} SpoolmanScale-${{ matrix.env }}_factory.bin
      - name: Upload factory image
        uses: actions/upload-artifact@v4
        with:
          name: factory-${{ matrix.env }}-${{ github.sha }}
          path: SpoolmanScale-${{ matrix.env }}_factory.bin
          retention-days: 14
