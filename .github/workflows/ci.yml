      - name: Test print card
        run: python3 test/test_print_card.py
      - name: Test label printer texts
        run: python3 test/test_label_printer_texts.py
      - name: Test the page script check
        run: python3 test/test_check_web_js.py
      - name: Test the colour table's download and store
        run: python3 test/test_bambu_catalog_store.py
