name: CI

# Every push to a working branch and every pull request: the house rules of
# this project as a script, and a firmware build. The release itself stays
# in build-all-boards.yml and runs on a tag push only.
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**', 'feat/**']
    paths-ignore: ['images/**', '*.md']
  pull_request:
    paths-ignore: ['images/**', '*.md']
  # Run workflow in the Actions tab: builds the documentation firmware (job
  # doc). The other jobs run as well, on the branch that was picked.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
