        run: python3 test/test_density_rest.py

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      # One job per board: a change that builds for one and breaks another
      # is caught here, not by whoever owns the other board.
      fail-fast: false
      matrix:
        env: [wt32-sc01-plus, waveshare-s3-lcd7, waveshare-s3-lcd7b]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned like the platform and the libraries: 6.2.0.post1 reports itself
      # as 6.2.0-post.1, which the pinned platform reads as older than the
      # 6.2.0 it requires, and every build stopped there (27.10.2026).
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      # The platform builds part of the firmware in its own Python environment
      # (~/.platformio/penv) and installs "pioarduino>=6.2.0" there, which
      # now resolves to 6.2.0.post1 with the same version string problem.
      # Created here with 6.2.0, the platform finds it satisfied and keeps it.
      - name: Pin PlatformIO inside the platform's environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install --quiet pioarduino==6.2.0
      - name: Build
        run: pio run -e ${{ matrix.env }}
      # The test that reads Moonraker's answers with the production parser needs
      # ArduinoJson's headers, which the build has fetched into libdeps; once is
      # enough, the parser is the same on every board.
      - name: Test Moonraker parse
        if: matrix.env == 'wt32-sc01-plus'
        run: python3 test/test_moonraker_parse.py .pio/libdeps/wt32-sc01-plus/ArduinoJson/src
      - name: Show the pioarduino the build ran with
        if: always()
        run: ls -d ~/.platformio/penv/lib/python3*/site-packages/pioarduino-*.dist-info || true
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots (partitions.csv). Since
        # v0.8.3 the firmware may outgrow the 3 MB slots of scales flashed
        # before that: such a scale reads the size from version.json, offers
        # the web flasher instead of the update, and moves to the new table
        # over USB once. More than 6 MB fits no device at all.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Check the board line
        # Every image carries "SpoolmanScale-board:<board id>", which the scale
        # reads before it takes an image (src/services/board_image.cpp). Read
        # here for every board on every push, with the same script the release
        # workflow runs over its files (scripts/board_marker.py): a build that
        # lost its line or carries another board's shows now, not on the day
        # of a release.
        run: python3 scripts/board_marker.py .pio/build/${{ matrix.env }}/firmware.bin ${{ matrix.env }}
      # Here rather than in the house-rules job: both tools measure icons from
      # LVGL's symbol header, and that only exists once the build has unpacked
      # the library.
      - name: French column and width budgets
        # Once is enough: the texts are the same on every board, and the tools
        # read LVGL's symbol header from this board's libdeps.
        if: matrix.env == 'wt32-sc01-plus'
        run: |
          if [ -f tools/lang_fr.py ]; then
            python3 tools/lang_fr.py check
            python3 tools/fit_check.py --gate
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
      - name: Check the factory image
        # Why every board leaves one: a board whose screen cannot open yet (a
        # new one, or a panel setup that is still wrong) cannot reach the
        # settings page or the browser upload, the two gates every other way
        # of getting firmware onto a scale goes through. Its first flash is
        # over USB, at offset 0, and that takes bootloader, partition table,
        # boot_app0 and firmware as one file.
        #
        # The platform already writes that file at the end of every build:
        # firmware.factory.bin, merged by esptool at 0x0 bootloader, 0x8000
        # partitions, 0xe000 boot_app0, 0x10000 firmware, with the flash mode,
        # frequency and size of the board (esp32_create_combined_bin in the
        # platform's builder; its lines show in the build log). So this does
        # not merge a second time. It would not be safer: `pio pkg exec`
        # starts esptool with the Python that runs pio, and that one lacks the
        # rich_click module esptool 5.4 imports (it fails with
        # ModuleNotFoundError when tried on a Windows machine), while the
        # platform's own step uses its private environment.
        #
        # What the platform does not do is fail the build when that merge goes
        # wrong, it only prints a line. A broken image must not reach someone
        # who has no screen to find out with, so look at the result here.
        #
        # The look is scripts/factory_image.py (test/test_factory_image.py
        # holds it to what it must refuse), so that the release workflow checks
        # its factory file with the same code. It prints the sizes, refuses a
        # file that does not hold this build's firmware at 0x10000 or lacks the
        # bootloader and the partition table, and only then copies.
        #
        # The copy gets a name of its own, so that images of different boards
        # cannot be mixed up once downloaded (same scheme as the release's
        # factory file). To flash: esptool --chip esp32s3 write-flash 0x0 <file>
        run: python3 scripts/factory_image.py .pio/build/${{ matrix.env }} SpoolmanScale-${{ matrix.env }}_factory.bin
      - name: Upload factory image
        uses: actions/upload-artifact@v4
        with:
          name: factory-${{ matrix.env }}-${{ github.sha }}
          path: SpoolmanScale-${{ matrix.env }}_factory.bin
          retention-days: 14

  # The acceptance firmware: the 7B with the touch from the web and the
  # simulated weight (SSC_ACCEPTANCE, set by the environment
  # waveshare-s3-lcd7b-abnahme and by nothing else), built to be put on the
  # scale for an acceptance. On a push to a work branch only: dev and main are
  # what gets released, a pull request has no use for it, and a manual run is
  # for the documentation firmware below. A job of its own and not a fourth
  # entry of the matrix above, so that the three boards a release builds stay
  # as they are.
  #
  # Its artifact is kept one day. This fork is public, and any signed-in GitHub
  # user can download an artifact, remote control included: it must not stay
  # around longer than the test needs it. It is never a release file, and the
  # release workflow refuses any file that carries the routes.
  acceptance:
    name: Acceptance firmware (waveshare-s3-lcd7b)
    if: github.event_name == 'push' && github.ref_name != 'dev' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned like in the Build job, for the same reasons: 6.2.0.post1 and
      # the platform's own pioarduino>=6.2.0 both read as older than 6.2.0.
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Pin PlatformIO inside the platform's environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install --quiet pioarduino==6.2.0
      - name: Build waveshare-s3-lcd7b-abnahme
        run: pio run -e waveshare-s3-lcd7b-abnahme
      - name: Refuse a binary an installed device could not take
        # As in the Build job: more than the 6 MB app slot fits no device.
        run: |
          SIZE=$(stat -c %s .pio/build/waveshare-s3-lcd7b-abnahme/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Check the board line
        # The environment is named for the 7B but its image must still be the
        # 7B's: the scale refuses an image of another board when it flashes.
        run: python3 scripts/board_marker.py .pio/build/waveshare-s3-lcd7b-abnahme/firmware.bin waveshare-s3-lcd7b
      - name: Check that the build holds the remote control
        # The proof that this job built what its name says. A build whose
        # switch got lost would still succeed, and the artifact would be flashed
        # as the acceptance firmware and then answer nothing. /api/touch is
        # spelled in src/web/web_doc.cpp only, which compiles to nothing
        # without the switch, so the text is in the image or the switch was not.
        run: |
          FILE=.pio/build/waveshare-s3-lcd7b-abnahme/firmware.bin
          if grep -a -q -F -e '/api/touch' "$FILE"; then
            echo "$FILE holds /api/touch"
          else
            echo "::error::$FILE has no /api/touch, SSC_ACCEPTANCE did not reach this build"
            exit 1
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-waveshare-s3-lcd7b-${{ github.sha }}
          path: .pio/build/waveshare-s3-lcd7b-abnahme/firmware.bin
          retention-days: 1

  # The documentation firmware: the acceptance firmware that also writes
  # nothing to any server, printer or tag and shows no update dot
  # (SSC_DOC_BUILD, set by the environment waveshare-s3-lcd7b-doku), for the
  # screenshots of the documentation. On request only (Run workflow, with the
  # branch picked): nobody needs it with every push. Its artifact is kept one
  # day for the reason given at the acceptance job, and it is never a release
  # file either.
  doc:
    name: Documentation firmware (waveshare-s3-lcd7b)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned like in the Build job, see there.
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Pin PlatformIO inside the platform's environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install --quiet pioarduino==6.2.0
      - name: Build waveshare-s3-lcd7b-doku
        run: pio run -e waveshare-s3-lcd7b-doku
      - name: Refuse a binary an installed device could not take
        run: |
          SIZE=$(stat -c %s .pio/build/waveshare-s3-lcd7b-doku/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      - name: Check the board line
        run: python3 scripts/board_marker.py .pio/build/waveshare-s3-lcd7b-doku/firmware.bin waveshare-s3-lcd7b
      - name: Check that the build holds the remote control
        # SSC_DOC_BUILD implies SSC_ACCEPTANCE (src/app_config.h), so the
        # routes are in this image as well; see the acceptance job.
        run: |
          FILE=.pio/build/waveshare-s3-lcd7b-doku/firmware.bin
          if grep -a -q -F -e '/api/touch' "$FILE"; then
            echo "$FILE holds /api/touch"
          else
            echo "::error::$FILE has no /api/touch, SSC_DOC_BUILD did not reach this build"
            exit 1
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: doc-waveshare-s3-lcd7b-${{ github.sha }}
          path: .pio/build/waveshare-s3-lcd7b-doku/firmware.bin
          retention-days: 1
